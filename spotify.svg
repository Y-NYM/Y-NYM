    <rect width="88" height="88" rx="12" fill="#161B22"/>
    <image href="https://upload.wikimedia.org/wikipedia/en/a/aa/Billie_Eilish_-_Hit_Me_Hard_and_Soft.png" width="88" height="88" clip-path="url(#albumClip)" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <!-- Название и исполнитель (чистый белый и серый) -->
  <text x="124" y="44" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="-0.3">CHIHIRO</text>
  <text x="124" y="66" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500">Billie Eilish</text>

  <!-- Зеленый бейдж SPOTIFY -->
  <g transform="translate(400, 16)">
    <rect width="66" height="22" rx="11" fill="#1DB954" fill-opacity="0.12" stroke="#1DB954" stroke-opacity="0.3"/>
    <circle cx="10" cy="11" r="3.5" fill="#1DB954"/>
