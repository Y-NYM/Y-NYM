<svg xmlns="http://www.w3.org/2000/svg" width="480" height="120" viewBox="0 0 480 120" fill="none">
  <!-- Тёмная карточка -->
  <rect width="480" height="120" rx="16" fill="#090D13" stroke="#21262D" stroke-width="1.5"/>

  <!-- Обложка альбома -->
